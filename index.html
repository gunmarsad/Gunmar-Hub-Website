<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gunmar Hub - Key System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <div class="header">

            <img src="logo.png" class="main-logo" alt="Gunmar Hub">

            <h1>GUNMAR HUB</h1>

            <p>
                Choose a method below to get your key
            </p>

        </div>


        <!-- KEY OPTIONS -->
        <section class="cards">


            <!-- LOOTLABS 48H -->
            <div class="card">

                <img src="lootlabs.png"
                     class="method-logo"
                     alt="LootLabs">

                <h2>LootLabs 48H</h2>

                <p>
                    3 Checkpoints • 48 Hours
                </p>

                <button
                    id="btn1"
                    class="key-button"
                    disabled>

                    Please wait... (8s)

                </button>

            </div>



            <!-- LOOTLABS 12H -->
            <div class="card">

                <img src="lootlabs.png"
                     class="method-logo"
                     alt="LootLabs">

                <h2>LootLabs 12H</h2>

                <p>
                    1 Checkpoint • 12 Hours
                </p>

                <button
                    id="btn2"
                    class="key-button"
                    disabled>

                    Please wait... (8s)

                </button>

            </div>



            <!-- LOOTLABS 24H -->
            <div class="card">

                <img src="lootlabs.png"
                     class="method-logo"
                     alt="LootLabs">

                <h2>LootLabs 24H</h2>

                <p>
                    2 Checkpoints • 24 Hours
                </p>

                <button
                    id="btn3"
                    class="key-button"
                    disabled>

                    Please wait... (8s)

                </button>

            </div>



            <!-- LINKVERSITE 6H -->
            <div class="card">

                <img src="linkversite.png"
                     class="method-logo"
                     alt="Linkversite">

                <h2>Linkversite 6H</h2>

                <p>
                    1 Checkpoint • 6 Hours
                </p>

                <button
                    id="btn4"
                    class="key-button"
                    disabled>

                    Please wait... (8s)

                </button>

            </div>

        </section>



        <!-- EXTRA BUTTONS -->
        <div class="extra-buttons">

            <a
                href="https://discord.gg/dWhxP9aTeV"
                target="_blank"
                class="extra-button discord">

                <span>💬</span>

                Join Discord

            </a>


            <a
                href="https://youtu.be/uCeu0YzP13Y?si=9sJpYoQA2x3l-jjr"
                class="extra-button tutorial">

                <span>▶</span>

                Tutorial

            </a>

        </div>


        <div class="footer">
            Gunmar Hub © 2026
        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
